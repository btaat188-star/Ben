<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Actions Tracker</title>
<style>
  :root{
    --red:#c0392b; --red-bg:#fdecea;
    --green:#1e8449; --green-bg:#e9f7ef;
    --ink:#1c1c1e; --sub:#6b6b70; --line:#e3e3e6; --bg:#f7f7f8; --card:#ffffff;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);}
  .wrap{max-width:720px;margin:0 auto;padding:20px 16px 60px;}
  h1{font-size:22px;margin:4px 0 2px;}
  .subtitle{color:var(--sub);font-size:14px;margin-bottom:18px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;}
  .sq{border-radius:12px;padding:12px 8px;text-align:center;cursor:pointer;border:1px solid var(--line);transition:transform .08s;}
  .sq:active{transform:scale(.96);}
  .sq.red{background:var(--red-bg);color:var(--red);}
  .sq.green{background:var(--green-bg);color:var(--green);}
  .sq .d{font-weight:600;font-size:13px;}
  .sq .p{font-size:18px;font-weight:700;margin-top:4px;}
  .back{display:inline-flex;align-items:center;gap:4px;color:var(--sub);background:none;border:none;font-size:15px;padding:8px 0;cursor:pointer;}
  .day-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
  .status-pill{padding:4px 12px;border-radius:999px;font-weight:700;font-size:13px;}
  .status-pill.red{background:var(--red-bg);color:var(--red);}
  .status-pill.green{background:var(--green-bg);color:var(--green);}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0;}
  .card h2{font-size:15px;margin:0 0 10px;color:var(--sub);text-transform:uppercase;letter-spacing:.04em;}
  .row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
  .row:last-child{border-bottom:none;}
  .row input[type=checkbox]{width:20px;height:20px;margin-top:2px;flex:none;}
  .row .label{font-weight:600;font-size:15px;}
  .row .desc{color:var(--sub);font-size:13px;margin-top:2px;}
  .row .note{margin-top:6px;}
  .note input{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px;}
  .reflection{padding:10px 0;border-bottom:1px solid var(--line);}
  .reflection:last-child{border-bottom:none;}
  .reflection .q{font-weight:600;font-size:14px;margin-bottom:6px;}
  textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:14px;font-family:inherit;resize:vertical;min-height:44px;}
  .reflection.empty textarea{border-color:#e0a8a0;}
  .money{display:flex;align-items:center;gap:8px;}
  .money input{border:1px solid var(--line);border-radius:8px;padding:8px;font-size:14px;width:140px;}
  .protocol-link{display:flex;align-items:center;justify-content:space-between;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0;cursor:pointer;text-align:left;font-size:15px;font-weight:600;color:var(--ink);}
  .protocol-link .meta{color:var(--sub);font-weight:500;font-size:13px;}
  .chev{color:var(--sub);font-size:18px;}
  .block-title{font-size:13px;font-weight:700;color:var(--sub);margin:18px 0 6px;text-transform:uppercase;letter-spacing:.03em;}
  .block-title:first-child{margin-top:0;}
  .proto-row{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);}
  .proto-row:last-child{border-bottom:none;}
  .proto-row input{width:19px;height:19px;margin-top:2px;flex:none;}
  .proto-row label{font-size:14px;line-height:1.35;}
  .proto-progress{color:var(--sub);font-size:13px;margin-bottom:10px;}
  .block-note{color:var(--sub);font-size:12.5px;line-height:1.4;margin:-4px 0 8px;}
  .tabs{display:flex;gap:6px;margin-bottom:18px;overflow-x:auto;}
  .tab{flex:none;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--sub);cursor:pointer;}
  .tab.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .sync-code{font-size:24px;font-weight:700;letter-spacing:.04em;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:14px;text-align:center;margin:10px 0;word-break:break-all;}
  .sync-input{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:14px;margin-bottom:10px;}
  .sync-status{font-size:13px;color:var(--sub);margin:0 0 10px;}
  .copy-reminder{text-decoration:underline;font-weight:700;font-size:13px;margin:-6px 0 10px;}
  .sq .sublabel{font-size:10px;font-weight:600;margin-top:3px;opacity:0.75;line-height:1.2;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
function toISODate(dt){
  const pad = n => String(n).padStart(2,'0');
  return dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate());
}
const DATES = (function(){
  const out=[]; const start=new Date(2026,6,9); const end=new Date(2026,8,8);
  let d=new Date(start);
  while(d<=end){ out.push(toISODate(d)); d.setDate(d.getDate()+1); }
  return out;
})();

const SA_ACTION_IDS = ['sleep','morning','training','eat','work'];

function getActionsForDate(d){
  return (DATE_LABELS[d] && DATE_LABELS[d].sa) ? ACTIONS.filter(a=>SA_ACTION_IDS.includes(a.id)) : ACTIONS;
}

function getActionDesc(a, d){

  if(a.id==='eat'){ const day=new Date(d+'T00:00:00').getDay(); return WEEKLY_DIET[day]||a.desc; }

}

const COPY_ACTIONS = [
  {id:'c_calls', t:'50 cold calls minimum on weekdays — biggest money maker right now'},
  {id:'c_forward', t:'Forward any form submissions to Derrick immediately', optional:true},
  {id:'c_ads', t:'Check Google Ads every morning — clicks, impressions, conversions'},
  {id:'c_emails', t:'Respond to any client or prospect emails immediately', optional:true},

  {id:'c_tracking', t:'Update tracking spreadsheet with any new leads', optional:true},
  {id:'c_delivered', t:'Complete at least one piece of actual client work (tick if there was any to do)', optional:true}
];

const COPY_OPTIONAL = [
  {id:'o_trw', t:'(Optional) Post TRW update every 2 days'},
  {id:'o_tasklist', t:'(Optional) Review master task list'},
  {id:'o_learn', t:'(Optional) Read something that makes you better at your craft'}
];

const STORE_KEY = 'dailyActionsTracker_v1';
const SYNC_KEY = 'dailyActionsTracker_syncId';
let state = loadState();
saveLocalOnly();
let view = {tracker:'daily', screen:'grid', date:null};
let syncId = localStorage.getItem(SYNC_KEY) || '';
let syncStatus = 'idle';
let cloudPushTimer = null;
let lastSyncTime = null;

function ensureDates(data){
  if(!data.daily) data.daily = {};
  if(!data.copy) data.copy = {};
  DATES.forEach(d=>{
    if(!data.daily[d]) data.daily[d] = {actions:{}, notes:{}, reflections:{}, money:'', protocol:{}, protocolNote:''};
    if(!data.copy[d]) data.copy[d] = {actions:{}, optional:{}};
  });
  return data;
}
function loadState(){
  let raw = {};
  try{ raw = JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }catch(e){ raw = {}; }
  const data = (raw.daily || raw.copy) ? raw : {daily: raw, copy: {}};
  return ensureDates(data);
}
function saveLocalOnly(){ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
function saveState(){ saveLocalOnly(); cloudPush(); }

function setSyncStatus(s){
  syncStatus = s;
  const el = document.getElementById('sync-status');
  if(el) el.textContent = syncStatusText();
}
function syncStatusText(){
  if(!syncId) return '';
  if(syncStatus==='connecting') return 'Syncing…';
  if(syncStatus==='ok') return '✓ Synced' + (lastSyncTime ? ' at ' + lastSyncTime.toLocaleTimeString() : '');
  if(syncStatus==='error') return '⚠ Could not reach sync server (will retry on your next change)';
  return '';
}
function cloudPush(){
  if(!syncId) return;
  clearTimeout(cloudPushTimer);
  cloudPushTimer = setTimeout(doCloudPush, 500);
}
function doCloudPush(){
  if(!syncId) return Promise.resolve();
  return fetch('https://kvdb.io/'+syncId+'/state', {method:'POST', body: JSON.stringify(state)})
    .then(r=>{ if(!r.ok) throw new Error('bad status'); lastSyncTime = new Date(); setSyncStatus('ok'); })
    .catch(()=>{ setSyncStatus('error'); });
}
function cloudPull(){
  if(!syncId) return Promise.resolve();
  setSyncStatus('connecting');
  return fetch('https://kvdb.io/'+syncId+'/state')
    .then(r=>{
      if(r.status===404) return null;
      if(!r.ok) throw new Error('bad status');
      return r.text();
    })
    .then(text=>{
      if(text){
        const parsed = JSON.parse(text);
        state = ensureDates(parsed);
        saveLocalOnly();
      }
      lastSyncTime = new Date();
      setSyncStatus('ok');
      render();
    })
    .catch(()=>{ setSyncStatus('error'); render(); });
}
function manualSync(){
  clearTimeout(cloudPushTimer);
  setSyncStatus('connecting');
  doCloudPush().then(cloudPull);
}
function createSyncCode(){
  setSyncStatus('connecting');
  fetch('https://kvdb.io/', {method:'POST'})
    .then(r=>r.text())
    .then(id=>{
      syncId = id.trim();
      localStorage.setItem(SYNC_KEY, syncId);
      return fetch('https://kvdb.io/'+syncId+'/state', {method:'POST', body: JSON.stringify(state)});
    })
    .then(()=>{ setSyncStatus('ok'); render(); })
    .catch(()=>{ setSyncStatus('error'); render(); });
}
function connectSyncCode(code){
  code = code.trim();
  if(!code) return;
  syncId = code;
  localStorage.setItem(SYNC_KEY, syncId);
  render();
  cloudPull();
}

function protocolRequiredStats(d){
  const day = state.daily[d];
  let total=0, done=0, block6Done=false, sawBlock6=false;
  PROTOCOL.forEach(sec=>sec.items.forEach(it=>{
    if(it.group==='block6'){
      sawBlock6 = true;
      if(day.protocol[it.id]) block6Done = true;
      return;
    }
    if(it.optional) return;
    total++;
    if(day.protocol[it.id]) done++;
  }));
  if(sawBlock6){ total++; if(block6Done) done++; }
  return {done, total};
}
function dayPercent(d){
  const day = state.daily[d];
  let count=0, total=0;
  getActionsForDate(d).forEach(a=>{ total++; if(day.actions[a.id]) count++; });
  REFLECTIONS.forEach(r=>{ total++; if(day.reflections[r.id] && day.reflections[r.id].trim()!=='') count++; });
  const proto = protocolRequiredStats(d);
  count += proto.done; total += proto.total;
  return Math.round(count/total*100);
}
function protocolProgress(d){
  const day = state.daily[d];
  let total=0, done=0;
  PROTOCOL.forEach(sec=>sec.items.forEach(it=>{ total++; if(day.protocol[it.id]) done++; }));
  return {done,total};
}
function isWeekend(d){
  const day = new Date(d+'T00:00:00').getDay();
  return day===0 || day===6;
}
function copyPercent(d){
  const day = state.copy[d];
  let total=0, done=0;
  COPY_ACTIONS.forEach(a=>{
    if(a.optional) return;
    if(a.id==='c_calls' && isWeekend(d)) return;
    total++;
    if(day.actions[a.id]) done++;
  });
  return Math.round(done/total*100);
}
function combinedPercent(d){
  return Math.round((dayPercent(d) + copyPercent(d))/2);
}
function fmtDate(d){
  const dt = new Date(d+'T00:00:00');
  return dt.toLocaleDateString('en-GB',{weekday:'short', day:'numeric', month:'short'});
}

function renderNav(){
  const tabs = [['daily','Daily Actions'],['copy','Copywriting Constants Daily'],['overview','Overview'],['sync', syncId ? 'Sync ✓' : 'Sync']];
  return `<div class="tabs">` + tabs.map(([key,label])=>
    `<button class="tab ${view.tracker===key?'active':''}" data-tab="${key}">${label}</button>`
  ).join('') + `</div>`;
}

function renderSync(){
  let html = `<h1>Sync Across Devices</h1>`;
  if(syncId){
    html += `<div class="card">
      <h2>Status</h2>
      <p class="sync-status" id="sync-status">${syncStatusText()}</p>
      <button class="protocol-link" data-action="manual-sync"><span>Sync Now</span></button>
      <h2 style="margin-top:18px;">Your Sync Code</h2>
      <div class="sync-code">${escapeHtml(syncId)}</div>
      <div class="desc">Open this same page on your other device, go to the Sync tab, and paste this exact code into "I already have a code". After that both devices push changes automatically — tap "Sync Now" (or revisit this tab) on a device when you want it to grab the other device's latest changes.</div>
    </div>`;
  } else {
    html += `<div class="card">
      <h2>Step 1 — do this on one device only</h2>
      <div class="desc">Creates a private code and uploads what's already on this device.</div>
      <button class="protocol-link" data-action="create-sync" style="margin-top:10px;"><span>Create a new sync code</span></button>
    </div>
    <div class="card">
      <h2>Step 2 — do this on your other device</h2>
      <div class="desc">Paste the code you got from Step 1.</div>
      <input type="text" class="sync-input" id="sync-code-input" placeholder="Paste sync code here">
      <button class="protocol-link" data-action="connect-sync"><span>Connect with this code</span></button>
    </div>`;
  }
  return html;
}

function render(){
  const app = document.getElementById('app');
  let body = '';
  if(view.tracker==='overview'){
    body = renderOverview();
  } else if(view.tracker==='copy'){
    if(view.screen==='day') body = renderCopyDay(view.date);
    else body = renderCopyGrid();
  } else if(view.tracker==='sync'){
    body = renderSync();
  } else {
    if(view.screen==='day') body = renderDay(view.date);
    else if(view.screen==='protocol') body = renderProtocol(view.date);
    else body = renderGrid();
  }
  app.innerHTML = renderNav() + body;
  bindEvents();
}

function renderGrid(){
  let html = `<h1>Daily Actions Tracker</h1><div class="subtitle">9 July – 8 September</div><div class="grid">`;
  DATES.forEach(d=>{
    const pct = dayPercent(d);
    const cls = pct===100 ? 'green' : 'red';
    const meta = DATE_LABELS[d] ? `<div class="sublabel">${DATE_LABELS[d].label}</div>` : '';
    html += `<div class="sq ${cls}" data-date="${d}"><div class="d">${fmtDate(d)}</div><div class="p">${pct}%</div>${meta}</div>`;
  });
  html += `</div>`;
  return html;
}

function renderCopyGrid(){
  let html = `<h1>Copywriting Constants Daily</h1><div class="copy-reminder">Remember: these will change over time</div><div class="subtitle">9 July – 8 September</div><div class="grid">`;
  DATES.forEach(d=>{
    const pct = copyPercent(d);
    const cls = pct===100 ? 'green' : 'red';
    const meta = DATE_LABELS[d] ? `<div class="sublabel">${DATE_LABELS[d].label}</div>` : '';
    html += `<div class="sq ${cls}" data-copy-date="${d}"><div class="d">${fmtDate(d)}</div><div class="p">${pct}%</div>${meta}</div>`;
  });
  html += `</div>`;
  return html;
}

function renderOverview(){
  let html = `<h1>Overview</h1><div class="subtitle">Daily Actions + Copywriting combined</div><div class="grid">`;
  DATES.forEach(d=>{
    const pct = combinedPercent(d);
    const cls = pct===100 ? 'green' : 'red';
    const meta = DATE_LABELS[d] ? `<div class="sublabel">${DATE_LABELS[d].label}</div>` : '';
    html += `<div class="sq ${cls}" data-overview-date="${d}"><div class="d">${fmtDate(d)}</div><div class="p">${pct}%</div>${meta}</div>`;
  });
  html += `</div>`;
  return html;
}

function renderCopyDay(d){
  const day = state.copy[d];
  const pct = copyPercent(d);
  const cls = pct===100 ? 'green' : 'red';
  let html = `<button class="back" data-action="back-copy-grid">&larr; All days</button>
  <div class="copy-reminder">Remember: these will change over time</div>
  <div class="day-header"><h1>${fmtDate(d)}</h1><span class="status-pill ${cls}">${pct}% Complete</span></div>

  <div class="card"><h2>Must-Do (counts toward %)</h2>`;
  COPY_ACTIONS.forEach(a=>{
    const checked = day.actions[a.id] ? 'checked' : '';
    const weekendSkip = a.id==='c_calls' && isWeekend(d);
    const label = weekendSkip ? a.t + ' (not required on weekends)' : a.t;
    html += `<div class="row">
      <input type="checkbox" data-kind="copy-action" data-id="${a.id}" ${checked}>
      <div style="flex:1"><div class="label">${label}</div></div>
    </div>`;
  });
  html += `</div>`;

  html += `<div class="card"><h2>Optional (does not affect %)</h2>`;
  COPY_OPTIONAL.forEach(a=>{
    const checked = day.optional[a.id] ? 'checked' : '';
    html += `<div class="row">
      <input type="checkbox" data-kind="copy-optional" data-id="${a.id}" ${checked}>
      <div style="flex:1"><div class="label">${a.t}</div></div>
    </div>`;
  });
  html += `</div>`;

  return html;
}

function renderDay(d){
  const day = state.daily[d];
  const pct = dayPercent(d);
  const cls = pct===100 ? 'green' : 'red';
  const proto = protocolProgress(d);
  let html = `<button class="back" data-action="back-grid">&larr; All days</button>
  <div class="day-header"><h1>${fmtDate(d)}</h1><span class="status-pill ${cls}">${pct}% Complete</span></div>

  <button class="protocol-link" data-action="open-protocol">
    <span>Daily Protocol Checklist</span>
    <span class="meta">${proto.done}/${proto.total} done &nbsp;›</span>
  </button>

  <div class="card"><h2>Actions</h2>`;
  getActionsForDate(d).forEach(a=>{
    const checked = day.actions[a.id] ? 'checked' : '';
    const noteVal = day.notes[a.id] || '';
    html += `<div class="row">
      <input type="checkbox" data-kind="action" data-id="${a.id}" ${checked}>
      <div style="flex:1">
        <div class="label">${a.label}</div>
        <div class="desc">${getActionDesc(a,d)}</div>
        ${a.note ? `<div class="note"><input type="text" placeholder="${a.note}" data-kind="note" data-id="${a.id}" value="${escapeAttr(noteVal)}"></div>` : ''}
      </div>
    </div>`;
  });
  html += `</div>`;

  html += `<div class="card"><h2>Reflection</h2>`;
  REFLECTIONS.forEach(r=>{
    const val = day.reflections[r.id] || '';
    const emptyCls = val.trim()==='' ? 'empty' : '';
    html += `<div class="reflection ${emptyCls}">
      <div class="q">${r.q}</div>
      <textarea data-kind="reflection" data-id="${r.id}" placeholder="Write something...">${escapeHtml(val)}</textarea>
    </div>`;
  });
  html += `</div>`;

  html += `<div class="card"><h2>Money</h2>
    <div class="money">£ <input type="number" inputmode="decimal" data-kind="money" value="${escapeAttr(day.money||'')}" placeholder="0"></div>
  </div>`;

  return html;
}

function renderProtocol(d){
  const day = state.daily[d];
  const proto = protocolProgress(d);
  let html = `<button class="back" data-action="back-day">&larr; ${fmtDate(d)}</button>
  <h1>Daily Protocol Checklist</h1>
  <div class="proto-progress">${proto.done} / ${proto.total} done</div>`;
  PROTOCOL.forEach(sec=>{
    html += `<div class="block-title">${sec.block}</div>`;
    if(sec.note) html += `<div class="block-note">${sec.note}</div>`;
    sec.items.forEach(it=>{
      const checked = day.protocol[it.id] ? 'checked' : '';
      html += `<div class="proto-row">
        <input type="checkbox" data-kind="protocol" data-id="${it.id}" ${checked}>
        <label>${it.t}</label>
      </div>`;
    });
  });
  html += `<div class="card"><h2>Notes</h2>
    <textarea data-kind="protocol-note" placeholder="e.g. had 3 eggs instead of 5...">${escapeHtml(day.protocolNote||'')}</textarea>
  </div>`;
  return html;
}

function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escapeAttr(s){ return escapeHtml(s).replace(/"/g,'&quot;'); }

function bindEvents(){
  const app = document.getElementById('app');

  app.querySelectorAll('.tab').forEach(el=>{
    el.addEventListener('click', ()=>{ view = {tracker: el.dataset.tab, screen:'grid', date:null}; render(); });
  });

  app.querySelectorAll('[data-date]').forEach(el=>{
    el.addEventListener('click', ()=>{ view = {tracker:'daily', screen:'day', date: el.dataset.date}; render(); });
  });
  app.querySelectorAll('[data-copy-date]').forEach(el=>{
    el.addEventListener('click', ()=>{ view = {tracker:'copy', screen:'day', date: el.dataset.copyDate}; render(); });
  });
  app.querySelectorAll('[data-overview-date]').forEach(el=>{
    el.addEventListener('click', ()=>{ view = {tracker:'daily', screen:'day', date: el.dataset.overviewDate}; render(); });
  });

  const back = app.querySelector('[data-action="back-grid"]');
  if(back) back.addEventListener('click', ()=>{ view = {tracker:'daily', screen:'grid', date:null}; render(); });
  const backDay = app.querySelector('[data-action="back-day"]');
  if(backDay) backDay.addEventListener('click', ()=>{ view = {tracker:'daily', screen:'day', date: view.date}; render(); });
  const openProto = app.querySelector('[data-action="open-protocol"]');
  if(openProto) openProto.addEventListener('click', ()=>{ view = {tracker:'daily', screen:'protocol', date: view.date}; render(); });
  const backCopyGrid = app.querySelector('[data-action="back-copy-grid"]');
  if(backCopyGrid) backCopyGrid.addEventListener('click', ()=>{ view = {tracker:'copy', screen:'grid', date:null}; render(); });

  app.querySelectorAll('input[data-kind="action"]').forEach(el=>{
    el.addEventListener('change', ()=>{
      state.daily[view.date].actions[el.dataset.id] = el.checked;
      saveState(); render();
    });
  });
  app.querySelectorAll('input[data-kind="note"]').forEach(el=>{
    el.addEventListener('input', ()=>{
      state.daily[view.date].notes[el.dataset.id] = el.value;
      saveState();
    });
  });
  app.querySelectorAll('textarea[data-kind="reflection"]').forEach(el=>{
    el.addEventListener('input', ()=>{
      state.daily[view.date].reflections[el.dataset.id] = el.value;
      saveState();
      const pct = dayPercent(view.date);
      const pill = app.querySelector('.status-pill');
      if(pill){
        pill.textContent = pct+'% Complete';
        pill.className = 'status-pill ' + (pct===100?'green':'red');
      }
      el.closest('.reflection').classList.toggle('empty', el.value.trim()==='');
    });
  });
  app.querySelectorAll('input[data-kind="money"]').forEach(el=>{
    el.addEventListener('input', ()=>{
      state.daily[view.date].money = el.value;
      saveState();
    });
  });
  app.querySelectorAll('input[data-kind="protocol"]').forEach(el=>{
    el.addEventListener('change', ()=>{
      state.daily[view.date].protocol[el.dataset.id] = el.checked;
      saveState();
      const proto = protocolProgress(view.date);
      const prog = app.querySelector('.proto-progress');
      if(prog) prog.textContent = proto.done+' / '+proto.total+' done';
    });
  });
  app.querySelectorAll('textarea[data-kind="protocol-note"]').forEach(el=>{
    el.addEventListener('input', ()=>{
      state.daily[view.date].protocolNote = el.value;
      saveState();
    });
  });
  app.querySelectorAll('input[data-kind="copy-action"]').forEach(el=>{
    el.addEventListener('change', ()=>{
      state.copy[view.date].actions[el.dataset.id] = el.checked;
      saveState(); render();
    });
  });
  app.querySelectorAll('input[data-kind="copy-optional"]').forEach(el=>{
    el.addEventListener('change', ()=>{
      state.copy[view.date].optional[el.dataset.id] = el.checked;
      saveState();
    });
  });

  const createSync = app.querySelector('[data-action="create-sync"]');
  if(createSync) createSync.addEventListener('click', createSyncCode);
  const connectSync = app.querySelector('[data-action="connect-sync"]');
  if(connectSync) connectSync.addEventListener('click', ()=>{
    const input = app.querySelector('#sync-code-input');
    if(input) connectSyncCode(input.value);
  });
  const manualSyncBtn = app.querySelector('[data-action="manual-sync"]');
  if(manualSyncBtn) manualSyncBtn.addEventListener('click', manualSync);
}

render();
if(syncId) cloudPull();
</script>
</body>
</html>
